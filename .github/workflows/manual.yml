name: Keep Alive & Fix DB

on:
  schedule:
    - cron: '*/5 * * * *'  # هر ۵ دقیقه
  workflow_dispatch:       # برای اجرای دستی

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Ping Health
        run: |
          echo "Pinging /health ..."
          curl -s -o /dev/null -w "Health Status Code: %{http_code}\n" https://gold-analyzer-web.onrender.com/health

      - name: 2. Fix Database
        run: |
          echo "Calling /fix-db to repair database..."
          curl -s -X GET https://gold-analyzer-web.onrender.com/fix-db
