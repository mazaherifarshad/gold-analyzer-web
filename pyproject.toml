[project]
name = "gold-analyzer-web"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "sqlalchemy==2.0.23",
    "pandas==2.1.3",
    "numpy==1.26.0",
    "requests==2.31.0",
    "python-multipart==0.0.6",
    "pydantic==2.5.0",
    "python-dotenv==1.0.0",
    "aiohttp==3.9.1"
]

[tool.vercel]
entrypoint = "backend.main:app"